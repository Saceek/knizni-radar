  else if(S.view==="movies") html = viewMovies();
  else if(S.view==="steam") html = viewSteam();
  else if(S.view==="backlog") html = viewBacklog();
  else if(S.view==="diary") html = diaryViewHtml();
  else html = viewBooks();
  if(S.expanded){
    const b = allListItems().find(x=>x.title===S.expanded) || S.backlog.find(x=>x.title===S.expanded);
    if(b) html += bookModalHtml(b); else S.expanded=null;
  }
  view.innerHTML = `<div class="page">${html}</div>`;

  // vstupy a výběry ve filtrech
  const bind = (id, ev, fn) => { const el=document.getElementById(id); if(el) el[ev]=fn; };
  bind("mq","oninput",e=>{S.movieQ=e.target.value; render();});
  bind("msort","onchange",e=>{S.movieSort=e.target.value; render();});
  bind("mgenre","onchange",e=>{S.movieGenre=e.target.value; render();});
  bind("gsort","onchange",e=>{S.gameSort=e.target.value; render();});
  bind("ggenre","onchange",e=>{S.gameGenre=e.target.value; render();});
  bind("q","oninput",e=>{S.q=e.target.value; render();});
  bind("sort","onchange",e=>{S.sort=e.target.value; render();});
  bind("bgenre","onchange",e=>{S.bookGenre=e.target.value; render();});
  if(S.view==="backlog"){ mountAddPanel(); }
  if(S.view==="backlog"||S.view==="news"){ mountProgressWidget(); }
  if(S.view==="diary"){
    const add=document.getElementById("diary-add-btn"); if(add) add.onclick=()=>showDiaryModal();
    document.querySelectorAll("[data-diary-rm]").forEach(btn=>btn.onclick=()=>{
      const e=S.diary[+btn.dataset.diaryRm];
      if(!e || !confirm(`Odebrat „${e.title}“ ze Síně trofejí?`)) return;
      S.diary.splice(+btn.dataset.diaryRm,1); saveDiaryAndSync(S.diary); render();
    });
  }
  // zachovat fokus a kurzor ve vyhledávání při přerenderování
  if(active){ const el=document.getElementById(active.id); if(el){ el.focus(); try{ if(active.pos!=null) el.setSelectionRange(active.pos,active.pos); }catch(e){} } }

  const upd = S.view==="movies"?S.moviesUpdatedAt:S.view==="steam"?S.gamesUpdatedAt:S.view==="list"?S.updatedAt:S.view==="coming"?S.comingUpdatedAt:S.newsUpdatedAt;
  document.getElementById("foot").innerHTML = `<span>Data: Kosmas · Dobrovský · CREW · databazeknih.cz · ČSFD · Steam · HowLongToBeat · Můj seznam se synchronizuje přes GitHub</span>${upd?`<span>aktualizováno ${relTime(upd)}</span>`:""}`;
  enhanceRows();
  hydrateCovers();
}
// Vodorovné řady: šipky vlevo/vpravo (zobrazí se jen tam, kam se dá ještě posunout)
function enhanceRows(){
  document.querySelectorAll("#view .srow").forEach(row=>{
    const wrap=document.createElement("div"); wrap.className="srow-wrap";
    row.parentNode.insertBefore(wrap,row); wrap.appendChild(row);
    wrap.insertAdjacentHTML("beforeend", `<button class="sarr l" data-sdir="-1" aria-label="Posunout doleva">${icon("caret-left")}</button><button class="sarr r" data-sdir="1" aria-label="Posunout doprava">${icon("caret-right")}</button>`);
    const upd=()=>{ wrap.classList.toggle("can-l", row.scrollLeft>4); wrap.classList.toggle("can-r", row.scrollLeft+row.clientWidth < row.scrollWidth-4); };
    row.addEventListener("scroll", upd, {passive:true});
    upd();
  });
}
window.addEventListener("resize", ()=>document.querySelectorAll("#view .srow").forEach(r=>r.dispatchEvent(new Event("scroll"))));

function tryImg(el, src){ return new Promise(res=>{ const img=document.createElement('img'); img.referrerPolicy='no-referrer';
  img.onload=()=>{ el.appendChild(img); res(true); }; img.onerror=()=>res(false); img.src=src; }); }
async function googleCover(q){ try{
  const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=1&country=CZ`+gbKey());
  const d=await r.json(); const im=d?.items?.[0]?.volumeInfo?.imageLinks;
  const u=(im?.thumbnail||im?.smallThumbnail||"").replace("http://","https://").replace("&edge=curl",""); return u||null;
}catch(e){ return null; } }
let _hydrating=false, _hydrateAgain=false;
async function hydrateCovers(){
  if(_hydrating){ _hydrateAgain=true; return; }
  _hydrating=true; _hydrateAgain=false;
  const els=[...document.querySelectorAll('.cover[data-pending]')];
  for(const el of els){
    el.removeAttribute('data-pending');
    const direct=el.dataset.cover, q=el.dataset.q, t=el.dataset.title;
    if(direct && await tryImg(el,direct)) continue;
    let u=await googleCover(q); if(u && await tryImg(el,u)) continue;
    u=await googleCover(t); if(u) await tryImg(el,u);
  }
  _hydrating=false;
  if(_hydrateAgain) hydrateCovers();
}

// Vložení přímého odkazu na databazeknih.cz - obchází vyhledávání (které umí tiše
// zahodit knihu, když sdílí název s jinou - viz dedup výše) a natáhne detail rovnou.
async function fetchDbkByUrl(link){
  const target = `https://www.databazeknih.cz${new URL(link).pathname}`;
  const r = await fetch(`/api/proxy?url=${encodeURIComponent(target)}`);
  if(!r.ok) throw new Error("HTTP "+r.status);
  const html = await r.text();
  const h1 = html.match(/<h1[^>]*>([^<]+)<\/h1>/);
  const title = h1 ? h1[1].trim() : null;
  if(!title) throw new Error("Knihu se nepodařilo rozpoznat");
  const og = html.match(/property="og:image"\s+content="([^"]+)"/);
  const authorM = html.match(/href="\/autori\/[^"]+"[^>]*>([^<]+)</);
  const pagesM = html.match(/(\d{2,4})\s*str\.?\b/i);
  return { title, author: authorM?authorM[1].trim():null, cover: og?og[1]:null, link: target, pages: pagesM?+pagesM[1]:null };
}
async function runSearch(){
  const q=S.addQ.trim();
  const cat=S.addCat||"Vše";
  const author=(cat==="Knihy" ? S.addAuthor.trim() : "");
  const bookQ=[q, author].filter(Boolean).join(" ");
  if(!q && !author){ S.addResults=[]; S.addBusy=false; updateResults(); return; }
  if(q && /^https?:\/\/(www\.)?databazeknih\.cz\/(prehled-knihy|knihy)\//i.test(q)){
    S.addResults=[]; S.addErr=""; S.addBusy=true; updateResults();
    try{
      const b = await fetchDbkByUrl(q);
      S.addResults=[{title:b.title, author:b.author, cover:b.cover, link:b.link, url:b.link, pages:b.pages, cat:["databazeknih.cz"], _category:"book"}];
    }catch(e){ S.addErr="Nepodařilo se načíst odkaz ("+(e.message||"chyba")+")"; }
    S.addBusy=false; updateResults();
    return;
  }
  const ql=q.toLowerCase();
  const authorL=author.toLowerCase();
  const results=[];
  const searchBooks = cat==="Vše"||cat==="Knihy";
  const searchMovies = cat==="Vše"||cat==="Filmy & Seriály";
  const searchGames = cat==="Vše"||cat==="Hry";
  // Local data - název i autor musí sedět zvlášť (AND), ne dohromady jako jeden pytel textu
  if(searchBooks)(S.books||[]).forEach(b=>{
    const titleOk = !ql || (b.title||"").toLowerCase().includes(ql);
    const authorOk = !authorL || (b.author||"").toLowerCase().includes(authorL);
    if(titleOk && authorOk) results.push({...b,_category:"book"});
  });
  if(searchMovies)(S.movies||[]).forEach(m=>{ if((m.title+" "+(m.country||"")).toLowerCase().includes(ql)) results.push({...m,_category:m.type==="seriál"?"series":"movie"}); });
  if(searchGames)(S.games||[]).forEach(g=>{ if(g.name.toLowerCase().includes(ql)) results.push({title:g.name,_category:"game",image:g.image,url:g.url,tags:g.tags,price:g.price,rating:g.rating,gamePass:!!g.gamePass}); });
  S.addResults=results.slice(0,12);
  S.addErr="";
  updateResults();
  S.addBusy=true; updateResults();
  const online=[];
  const errs=[];
  // Steam search
  if(searchGames){
    try{
      const steamTarget=`https://store.steampowered.com/api/storesearch/?term=${encodeURIComponent(q)}&l=czech&cc=cz`;
      const sr=await fetch(`/api/proxy?url=${encodeURIComponent(steamTarget)}`);
      if(sr.ok){
        const sd=await sr.json();
        (sd.items||[]).slice(0,6).forEach(item=>{
          if(results.some(r=>r.title===item.name)||online.some(o=>o.title===item.name)) return;
          let price=item.price?.final!=null?(item.price.final/100).toFixed(2)+"€":null;
          let priceOriginal=item.price?.initial!=null&&item.price.initial!==item.price.final?(item.price.initial/100).toFixed(2)+"€":null;
          let discount=item.price?.initial&&item.price.final&&item.price.initial!==item.price.final?Math.round(100-item.price.final/item.price.initial*100):0;
          if(price==="0.00€"){ price="Zdarma"; priceOriginal=null; discount=0; }
          const img=(item.tiny_image||"").replace("shared.akamai.steamstatic.com","shared.cloudflare.steamstatic.com");
          online.push({title:item.name,_category:"game",image:img,url:`https://store.steampowered.com/app/${item.id}/`,tags:[],price,priceOriginal,discount,rating:item.metascore?+item.metascore:null,gamePass:isInGamePass(item.name)});
        });
      } else { errs.push("Steam: HTTP "+sr.status); }
    }catch(e){ errs.push("Steam vyhledávání selhalo ("+(e.message||"chyba sítě")+")"); }
  }
  // Databazeknih.cz search (primary, Czech books, via vlastní /api/proxy)
  if(searchBooks){
    try{
      const dbkTarget=`https://www.databazeknih.cz/vyhledavani/knihy?q=${encodeURIComponent(bookQ)}`;
      const r=await fetch(`/api/proxy?url=${encodeURIComponent(dbkTarget)}`);
      if(r.ok){
        const html=await r.text();
        // Obálka a titul/autor jsou dvě oddělené věci na stránce - obrázek nese jen "Obálka
        // knihy TITUL" (autor skoro nikdy v alt textu), skutečný autor je až v <span class='pozn'>
        // hned pod odkazem na titul o kus dál. Bez spojení obou částí zůstává autor téměř vždy null.
        const bookRe=/<img src="([^"]+)" alt="Obálka knihy [^"]+"[\s\S]{0,400}?<a class='new' type='book' href='([^']+)'>([^<]+)<\/a>\s*<br \/><span class='pozn'>\s*([^,<]*),?\s*([^<]*)<\/span>/g;
        for(const m of html.matchAll(bookRe)){
          const cover=m[1];
          const link='https://www.databazeknih.cz'+m[2];
          const title=m[3].trim();
          const bookAuthor=m[5].trim()||null;
          if(!title||online.some(o=>o.link===link)) continue;
          if(authorL && !(bookAuthor||"").toLowerCase().includes(authorL)) continue;
          online.push({title,author:bookAuthor,cover,_category:"book",link,url:link,cat:["databazeknih.cz"]});
          if(online.filter(o=>o._category==="book").length>=8) break;
        }
      } else { errs.push("Databazeknih: HTTP "+r.status); }
    }catch(e){ errs.push("Databazeknih vyhledávání selhalo ("+(e.message||"chyba sítě")+")"); }
  }
  S.addResults=[...results.slice(0,12),...online].slice(0,15);
  if(errs.length && !S.addResults.length) S.addErr=errs.join(" · ");
  S.addBusy=false;
  updateResults();
}
function bindAddButtons(rc){
  rc.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{
    const r=S.addResults[+btn.dataset.add];
    if(!r) return;
    const item={...r};
    if(!item._category) item._category="book";
    if(item._category==="series") item._category="movie"; // backlog má jen "movie" pro film i seriál
    if(inBacklog(item.title,item._category)) return;
    S.backlog.push(item);
    saveBacklogAndSync(S.backlog);
    S.addMsg="Přidáno ✓ – "+r.title;
    render();
  });
  rc.querySelectorAll('[data-addbare]').forEach(btn=>btn.onclick=()=>{
    const title=btn.dataset.addbare;
    if(!title||inBacklog(title,"movie")) return;
    S.backlog.push({title, _category:"movie", url:`https://www.csfd.cz/hledat/?q=${encodeURIComponent(title)}`});
    saveBacklogAndSync(S.backlog);
    S.addMsg="Přidáno ✓ – "+title+" (detaily doplní příští aktualizace dat)";
    render();
  });
  rc.querySelectorAll('[data-addcsfdlink]').forEach(btn=>btn.onclick=()=>{
    const url=btn.dataset.addcsfdlink;
    if(!url || S.backlog.some(x=>x.url===url)) return;
    // Zatím jen odhad názvu ze slugu odkazu - přesný název/rok/plakát/hodnocení doplní
    // enrichment, který díky přímému odkazu najde přesně tenhle titul, ne odhad podle názvu.
    const slug=(url.match(/\/film\/\d+-([^/]+)/)||[])[1]||"";
    const guess=slug.replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase())||"Film z ČSFD";
    S.backlog.push({title:guess, _category:"movie", url});
    saveBacklogAndSync(S.backlog);
    S.addMsg="Přidáno ✓ – "+guess+" (přesný název a detaily doplní příští aktualizace dat)";
    render();
  });
}
function updateResults(){
  const rc=document.getElementById('addresults');
  if(rc){ rc.innerHTML=resultsHtml(); bindAddButtons(rc); }
}
function mountAddPanel(){
  document.querySelectorAll('[data-addcat]').forEach(b=>b.onclick=()=>{
    S.addCat=b.dataset.addcat; S.addQ=""; S.addAuthor=""; S.addResults=[]; S.addMsg=""; render();
  });
  const inp=document.getElementById('addq');
  if(inp){
    inp.oninput=e=>{S.addQ=e.target.value; S.addMsg=""; runSearch();};
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); runSearch(); } };
  }
  const inpAuthor=document.getElementById('addauthor');
  if(inpAuthor){
    inpAuthor.oninput=e=>{S.addAuthor=e.target.value; S.addMsg=""; runSearch();};
    inpAuthor.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); runSearch(); } };
  }
  const go=document.getElementById('addgo'); if(go) go.onclick=runSearch;
  const rc=document.getElementById('addresults'); if(rc) bindAddButtons(rc);
}

function addBacklog(t){
  if(inBacklog(t,"book")) return;
  const b=S.books.find(x=>x.title===t);
  if(b){ S.backlog.push({...b,_category:"book"}); saveBacklogAndSync(S.backlog); render(); return; }
  const c=S.comicsBestsellers.find(x=>x.title===t);
  if(c && !inBacklog(t,"comic")){ S.backlog.push({...c,_category:"comic"}); saveBacklogAndSync(S.backlog); render(); }
}
function addMovieBacklog(t){ const m=S.movies.find(x=>x.title===t); if(m && !inBacklog(t,"movie")){ S.backlog.push({...m,_category:"movie"}); saveBacklogAndSync(S.backlog); render(); } }
function addGameBacklog(t){ const g=S.games.find(x=>x.name===t); if(g && !inBacklog(g.name,"game")){ S.backlog.push({title:g.name,_category:"game",appid:g.appid,rating:g.rating,reviews:g.reviews,scoreDesc:g.scoreDesc,image:g.image,url:g.url,tags:g.tags,price:g.price,released:g.released,gamePass:!!g.gamePass,demoAppid:g.demoAppid||null,wishlisted:!!g.wishlisted,recommended:!!g.recommended}); saveBacklogAndSync(S.backlog); render(); } }
function addComicBacklog(t){ const c=S.comics.find(x=>x.title===t)||S.comicsBestsellers.find(x=>x.title===t); if(c && !inBacklog(t,"comic")){ S.backlog.push({...c,_category:"comic"}); saveBacklogAndSync(S.backlog); render(); } }
// Bez cat smaže VŠECHNY položky s tím názvem bez ohledu na kategorii - používat jen tam,
// kde je kategorie po ruce (skoro všude), holé volání beze jen jako poslední záchrana.
function removeBacklog(t,cat){ S.backlog=S.backlog.filter(x=>!(x.title===t && (cat===undefined || (x._category||"book")===cat))); saveBacklogAndSync(S.backlog); render(); }
// Kniha/komiks se rozlišuje jen podle zdroje přidání (obecné hledání vs. CREW žebříček), ne
// podle obsahu - appka to nepozná sama, proto jde kategorii ručně přeřadit.
function setBacklogCategory(title, cat){
  const b=S.backlog.find(x=>x.title===title);
  if(!b) return;
  b._category=cat;
  saveBacklogAndSync(S.backlog);
  render();
}
// Dívá se na skutečně uloženou kategorii (ne na hádanou) - "Osamělý vlk" v backlogu jako
// film se tak nikdy neplete s "Osamělý vlk" jako kniha, ať už se tlačítko zmáčkne kdekoliv.
function toggleBacklog(t){ const x=S.backlog.find(b=>b.title===t); x?removeBacklog(t,x._category||"book"):addBacklog(t); }
function toggleMovieBacklog(t){ const x=S.backlog.find(b=>b.title===t&&(b._category||"book")==="movie"); x?removeBacklog(t,"movie"):addMovieBacklog(t); }
function toggleGameBacklog(t){ const x=S.backlog.find(b=>b.title===t&&(b._category||"book")==="game"); x?removeBacklog(t,"game"):addGameBacklog(t); }
function toggleComicBacklog(t){ const x=S.backlog.find(b=>b.title===t&&(b._category||"book")==="comic"); x?removeBacklog(t,"comic"):addComicBacklog(t); }

document.getElementById("sync-btn").onclick=showSyncSettings;
document.getElementById("diary-btn").onclick=()=>goView("diary");
function goView(v){ if(!VALID_VIEWS.has(v)) return; S.view=v; S.expanded=null; localStorage.setItem("knizniRadarView",v); window.scrollTo(0,0);
  if(v==="diary"){ render(); if(S.status==="idle") load(); if(S.comicsStatus==="idle") loadComics(); if(S.moviesStatus==="idle") loadMovies(); if(S.gamesStatus==="idle") loadGames(); return; }
  if(v==="steam" && S.gamesStatus==="idle"){ loadGames(); }
  else if(v==="movies" && S.moviesStatus==="idle"){ loadMovies(); }
  else if(v==="news" && S.newsStatus==="idle"){ loadNews(); }
  else if(v==="coming" && S.comingStatus==="idle"){ loadComing(); }
  else if(v==="list"){ if(S.status==="idle") load(); else render(); if(S.comicsStatus==="idle") loadComics(); }
  else { render(); }
}
document.getElementById("nav").onclick=e=>{ const v=e.target.closest("[data-view]")?.dataset.view; if(v) goView(v); };
document.getElementById("brand").onclick=()=>goView("news");
window.addEventListener("scroll",()=>document.getElementById("topnav").classList.toggle("solid", window.scrollY>30), {passive:true});
document.getElementById("view").onclick=e=>{
  if(e.target.dataset.closemodal){ S.expanded=null; render(); return; }
  const sd=e.target.dataset.sdir; if(sd){ const row=e.target.parentElement.querySelector(".srow"); row.scrollBy({left:+sd*Math.max(200,row.clientWidth*0.85), behavior:"smooth"}); return; }
  const gv=e.target.dataset.goview; if(gv){ goView(gv); return; }
  const cf=e.target.dataset.comingf; if(cf){ S.comingFilter=cf; render(); return; }
  const f=e.target.dataset.filter; if(f){S.filter=f; render(); return;}
  const bg=e.target.dataset.bgenre; if(bg){S.bookGenre=bg; render(); return;}
  const br=e.target.dataset.brarity; if(br){S.bookRarity=br; render(); return;}
  const m=e.target.dataset.more; if(m){S.expanded=S.expanded===m?null:m; render(); return;}
  const bk=e.target.dataset.bk; if(bk){toggleBacklog(bk); return;}
  const rm=e.target.dataset.rm; if(rm){removeBacklog(rm, e.target.dataset.rmcat); return;}
  const mt=e.target.dataset.mtype; if(mt){S.movieType=mt; render(); return;}
  const mg=e.target.dataset.mgenre; if(mg){S.movieGenre=mg; render(); return;}
  const mr=e.target.dataset.mrarity; if(mr){S.movieRarity=mr; render(); return;}
  const mbk=e.target.dataset.mbk; if(mbk){toggleMovieBacklog(mbk); return;}
  const gbk=e.target.dataset.gbk; if(gbk){toggleGameBacklog(gbk); return;}
  const nbk=e.target.dataset.newsbk; if(nbk){ if(!inBacklog(nbk,"book")){ const item=(S.news?.items||[]).find(i=>i.title===nbk); if(item){S.backlog.push(normalizeNewsBook(item)); saveBacklogAndSync(S.backlog); render();}} return;}
  const nmbk=e.target.dataset.newsmbk; if(nmbk){ if(!inBacklog(nmbk,"movie")){
    const item=(S.news?.items||[]).find(i=>i.title===nmbk)||(S.coming?.films||[]).find(i=>i.title===nmbk)||(S.coming?.series||[]).find(i=>i.title===nmbk);
    if(item){S.backlog.push(normalizeNewsMovie(item)); saveBacklogAndSync(S.backlog); render();}} return;}
  const ngbk=e.target.dataset.newsgbk; if(ngbk){ if(!inBacklog(ngbk,"game")){
    const item=(S.news?.items||[]).find(i=>i.title===ngbk)||(S.coming?.games||[]).find(i=>i.title===ngbk);
    if(item){S.backlog.push(normalizeNewsGame(item)); saveBacklogAndSync(S.backlog); render();}} return;}
  const cbk=e.target.dataset.cbk; if(cbk){toggleComicBacklog(cbk); return;}
  const ncbk=e.target.dataset.newscbk; if(ncbk){ if(!inBacklog(ncbk,"comic")){
    const item=(S.news?.items||[]).find(i=>i.title===ncbk);
    if(item){S.backlog.push({...item,_category:"comic"}); saveBacklogAndSync(S.backlog); render();}} return;}
  const gw=e.target.dataset.gwin; if(gw){S.gameWin=+gw; render(); return;}
  const gg=e.target.dataset.ggenre; if(gg){S.gameGenre=gg; render(); return;}
  const gr=e.target.dataset.grarity; if(gr){S.gameRarity=gr; render(); return;}
  const qscat=e.target.closest("[data-qscat]")?.dataset.qscat;
  if(qscat){ startQuestFromBacklog(qscat, e.target.closest("[data-qscat]").dataset.qstitle); return; }
  const setcatEl=e.target.closest("[data-setcatval]");
  if(setcatEl){ setBacklogCategory(setcatEl.dataset.setcattitle, setcatEl.dataset.setcatval); return; }
};

document.addEventListener("keydown",e=>{ if(e.key==="Escape" && S.expanded){ S.expanded=null; render(); } });

loadGamePass();
loadHLTB();
loadHwCompare();
syncBacklog();
syncDiary();
syncProgress();

if(S.view==="steam") loadGames();
else if(S.view==="movies") loadMovies();
else if(S.view==="coming") loadComing();
else if(S.view==="list"){ load(); loadComics(); }
else if(S.view==="diary"){ load(); loadComics(); loadMovies(); loadGames(); }
</script>
