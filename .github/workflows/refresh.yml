name: Refresh knihovny
on:
  schedule:
    - cron: '13 3 * * *'    # denně ~3:13 UTC (~4–5 ráno v ČR). Mimo celou hodinu záměrně –
                            # GitHub cronu na "0 4 * * *" pravidelně přidával 3-4h zpoždění
                            # (fronta plánovaných úloh je nejvytíženější přesně na hodinu)
  workflow_dispatch: {}      # přidá tlačítko "Run workflow" pro ruční spuštění
permissions:
  contents: write            # aby mohl commitnout výsledný JSON
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm i

      - name: Knihy → books.json
        run: node build.js
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}   # nepovinné; secret klidně zůstává GOOGLE_BOOKS_KEY

      - name: CREW komiksy → crew.json
        run: node build-crew.js
        continue-on-error: true       # když CREW/databazeknih zlobí, ať to nezhodí zbytek

      - name: PC Game Pass katalog → gamepass.json
        run: node build-gamepass.js
        continue-on-error: true       # když MS API zlobí, hry se prostě zobrazí bez Game Pass tagu

      - name: Steam → games.json
        run: node build-games.js
        continue-on-error: true       # když Steam zlobí, ať to nezhodí aktualizaci knih

      - name: Steam doporučení (wishlist/žánry) → games.json
        run: node build-steam-recs.js
        continue-on-error: true       # bez STEAM_API_KEY/STEAM_ID64 secrets se prostě přeskočí
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID64: ${{ secrets.STEAM_ID64 }}

      - name: Odehraný čas (Steam + Xbox) → playtime.json
        run: node build-playtime.js
        continue-on-error: true       # bez STEAM_API_KEY / XBL_API_KEY se daná část přeskočí
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID64: ${{ secrets.STEAM_ID64 }}
          XBL_API_KEY: ${{ secrets.XBL_API_KEY }}

      - name: HowLongToBeat → hltb.json
        run: node build-hltb.js
        continue-on-error: true       # když HLTB zlobí (mění endpoint), hry se prostě zobrazí bez odznaku

      - name: Porovnání HW s Xbox Ally X → hwcompare.json
        run: node build-hwcompare.js
        continue-on-error: true       # když Steam požadavky zlobí, hry se prostě zobrazí bez semaforu

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: ČSFD → movies.json
        run: node build-movies.js
        continue-on-error: true       # když ČSFD zlobí, ať to nezhodí zbytek

      - name: ČSFD + Steam → coming.json
        run: node build-coming.js
        continue-on-error: true

      - name: Metacritic → metacritic.json
        run: node build-metacritic.js
        continue-on-error: true       # když Metacritic zlobí, zůstanou poslední dobrá data

      - name: Čeština do her → czech.json
        run: node build-czech.js
        continue-on-error: true       # Steam / lokalizace.net / hernipreklady.cz – při výpadku zůstane cache

      - name: Enrichment backlogu (hodnocení + ceny)
        run: node build-enrich-backlog.js
        continue-on-error: true
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}

      - name: Knihovna (Palmknihy) → books.json
        run: node build-library.js
        continue-on-error: true

      - name: Novinky → news.json
        run: node build-news.js

      - name: Commit dat
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add books.json crew.json gamepass.json games.json hltb.json hwcompare.json movies.json coming.json news.json news-history.json news-seen.json previous-books.json previous-crew.json previous-games.json previous-movies.json previous-gamepass.json backlog.json metacritic.json czech.json serialzone-cache.json playtime.json
          git diff --staged --quiet || git commit -m "data: refresh"
          git checkout -- .   # zbytky mimo commit (např. package-lock.json po npm i) by zablokovaly pull --rebase
          # během ~25 min běhu mohl do main přibýt commit (kód, sync z webu) – stáhnout a zkusit znovu;
          # při konfliktu v datových JSONech vyhrává čerstvě vygenerovaná verze z tohoto běhu
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
